services:
  app:
    image: customer-chat-app:local
    build:
      context: ../..
      dockerfile: deploy/linux/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_PATH: ${STORAGE_PATH:-/app/storage}
      APP_PORT: ${APP_PORT:-3000}
      APP_BIND_HOST: ${APP_BIND_HOST:-0.0.0.0}
      APP_UID: "${APP_UID:?APP_UID must be explicitly set to a non-root host UID}"
      APP_GID: "${APP_GID:?APP_GID must be explicitly set to the host app GID}"
    user: "${APP_UID:?APP_UID must be explicitly set to a non-root host UID}:${APP_GID:?APP_GID must be explicitly set to the host app GID}"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "${APP_PORT:-3000}"
    volumes:
      - ./storage:${STORAGE_PATH:-/app/storage}
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${APP_PORT:-3000}/healthz >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
