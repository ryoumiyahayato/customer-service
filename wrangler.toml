name = "support-chat-cloudflare"
main = "src/worker-public-gate.ts"
compatibility_date = "2026-06-26"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "customer_chat_db"
database_id = "9cda9221-878e-464f-8f0b-5577deec88af"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "customer-chat-uploads"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[[routes]]
pattern = "vx9qn7zr.org/*"
zone_name = "vx9qn7zr.org"

[[routes]]
pattern = "denglu.kefuxitong.net/*"
zone_name = "kefuxitong.net"

[vars]
VISITOR_ROOT_DOMAIN = "vx9qn7zr.org"
ADMIN_PUBLIC_HOST = "denglu.kefuxitong.net"
