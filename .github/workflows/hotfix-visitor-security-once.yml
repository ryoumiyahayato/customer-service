name: Apply visitor security hotfix once

on:
  push:
    branches:
      - hotfix/visitor-admin-domain-isolation-20260808

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/visitor-admin-domain-isolation-20260808
          fetch-depth: 0
      - name: Apply deterministic visitor security patches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin security/repo-wide-web-privacy-audit-20260808
          git show origin/security/repo-wide-web-privacy-audit-20260808:package-lock.json > package-lock.json
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/nanoid']?.version!=='3.3.17') process.exit(1)"
          python - <<'PY'
          from pathlib import Path

          p = Path('src/visitor/GuestChat.tsx')
          s = p.read_text()
          replacements = [
            ("const [sessionId, setSessionId] = useState<string>(() => localStorage.getItem('chat_session_id') || '');\n  const [visitorId, setVisitorId] = useState<string>(() => localStorage.getItem('chat_visitor_id') || '');", "const [sessionId, setSessionId] = useState<string>('');"),
            ("request = apiFetch<GuestBootstrapResponse>(endpoint, { method: 'POST', body: JSON.stringify({ visitorId }) });", "request = apiFetch<GuestBootstrapResponse>(endpoint, { method: 'POST', body: JSON.stringify({}) });"),
            ("if (res.visitorId && res.visitorId !== visitorId) { setVisitorId(res.visitorId); localStorage.setItem('chat_visitor_id', res.visitorId); }\n      if (res.session) { setSessionId(res.session.id); localStorage.setItem('chat_session_id', res.session.id); }", "if (res.session) setSessionId(res.session.id);"),
            ("}, [visitorId, resolvedInviteToken, sessionId, showNotFound]);", "}, [resolvedInviteToken, sessionId, showNotFound]);"),
            ("useEffect(() => { const f = (e: StorageEvent) => { if (e.key === 'chat_visitor_id' && e.newValue && e.newValue !== visitorId) window.location.reload(); }; addEventListener('storage', f); return () => removeEventListener('storage', f); }, [visitorId]);", "useEffect(() => {\n    localStorage.removeItem('chat_session_id');\n    localStorage.removeItem('chat_visitor_id');\n  }, []);"),
            ("senderId: visitorId,", "senderId: null,"),
            ("JSON.stringify({ sessionId, visitorId, clientMessageId, content, senderType: 'VISITOR', quoteMessageId: currentQuote?.id || null })", "JSON.stringify({ sessionId, clientMessageId, content, senderType: 'VISITOR', quoteMessageId: currentQuote?.id || null })"),
            ("JSON.stringify({ sessionId, visitorId, clientMessageId, content: '', messageType: 'image', imagePath: res.path, senderType: 'VISITOR' })", "JSON.stringify({ sessionId, clientMessageId, content: '', messageType: 'image', imagePath: res.path, senderType: 'VISITOR' })"),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'missing GuestChat anchor: {old[:80]}')
            s = s.replace(old, new)
          s = s.replace('senderId: visitorId,', 'senderId: null,')
          p.write_text(s)

          p = Path('src/worker-final.ts')
          s = p.read_text()
          old = """async function unavailableConsumedInvite(req: Request, env: Env) {
  if (req.method.toUpperCase() !== 'POST') return null;
  const match = new URL(req.url).pathname.match(/^\\/api\\/guest\\/([a-f0-9]{40})$/i);
  if (!match) return null;
  const token = match[1].toLowerCase();
  const tokenHash = await hmacHex(env.SESSION_SECRET, `invite:${token}`);
  const invite = await env.DB.prepare(
    'SELECT expires_at,revoked_at,consumed_at FROM invite_links WHERE token_hash=? LIMIT 1',
  ).bind(tokenHash).first<InviteGateRow>();
  const now = new Date().toISOString();
  if (!invite || invite.revoked_at || invite.expires_at <= now || invite.consumed_at) {
    return jsonResponse({ error: 'invite_unavailable' }, {
      status: 410,
      headers: { 'Cache-Control': 'no-store', 'Referrer-Policy': 'no-referrer' },
    });
  }
  return null;
}
"""
          new = """async function inviteAvailabilityBlock(req: Request, env: Env) {
  const url = new URL(req.url);
  const method = req.method.toUpperCase();
  const consumeMatch = method === 'POST' ? url.pathname.match(/^\\/api\\/guest\\/([a-f0-9]{40})$/i) : null;
  const presentationMatch = method === 'GET' ? url.pathname.match(/^\\/api\\/invite-presentation\\/([a-f0-9]{40})$/i) : null;
  const match = consumeMatch || presentationMatch;
  if (!match) return null;
  const token = match[1].toLowerCase();
  const tokenHash = await hmacHex(env.SESSION_SECRET, `invite:${token}`);
  const invite = await env.DB.prepare(
    'SELECT expires_at,revoked_at,consumed_at FROM invite_links WHERE token_hash=? LIMIT 1',
  ).bind(tokenHash).first<InviteGateRow>();
  const now = new Date().toISOString();
  if (!invite || invite.revoked_at || invite.expires_at <= now || invite.consumed_at) {
    if (presentationMatch) {
      return jsonResponse({ presentation: null }, {
        status: 410,
        headers: { 'Cache-Control': 'no-store', 'Referrer-Policy': 'no-referrer' },
      });
    }
    return jsonResponse({ error: 'invite_unavailable' }, {
      status: 410,
      headers: { 'Cache-Control': 'no-store', 'Referrer-Policy': 'no-referrer' },
    });
  }
  return null;
}
"""
          if old not in s:
            raise SystemExit('missing invite availability anchor')
          s = s.replace(old, new)
          s = s.replace('const consumedInvite = await unavailableConsumedInvite(req, env);\n    if (consumedInvite) return consumedInvite;', 'const unavailableInvite = await inviteAvailabilityBlock(req, env);\n    if (unavailableInvite) return unavailableInvite;')
          p.write_text(s)
          PY
          git rm .github/workflows/hotfix-visitor-security-once.yml
          git add package-lock.json src/visitor/GuestChat.tsx src/worker-final.ts
          git diff --cached --check
          git commit -m "security: enforce ephemeral visitor sessions"
          git push origin HEAD:hotfix/visitor-admin-domain-isolation-20260808
