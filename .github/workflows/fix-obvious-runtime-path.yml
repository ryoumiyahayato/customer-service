name: Fix obvious runtime path

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'refactor/maintainability-session-state-phase1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/maintainability-session-state-phase1
          fetch-depth: 0

      - name: Apply path fix
        run: |
          python3 scripts/fix-obvious-runtime-path.py
          git checkout HEAD -- scripts/fix-obvious-runtime-path.py .github/workflows/fix-obvious-runtime-path.yml

      - name: Commit check update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-obvious-code-issues.mjs
          git commit -m 'test: inspect runtime worker in obvious checks'
          git push origin HEAD:refactor/maintainability-session-state-phase1

      - name: Validate
        run: |
          npm ci --no-audit --no-fund
          npm run check:obvious
          npm run typecheck
          npm run test
          npm run build
