name: Apply chat boundaries

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  apply:
    if: github.head_ref == 'refactor/maintainability-session-state-phase1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/maintainability-session-state-phase1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply chat boundary conversion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/apply-chat-boundaries.py > /tmp/chat-boundaries.log 2>&1
          status=$?
          cat /tmp/chat-boundaries.log
          if [ "$status" -ne 0 ]; then
            {
              echo '## Chat boundary conversion failure'
              echo
              echo '```text'
              tail -n 300 /tmp/chat-boundaries.log
              echo '```'
            } > /tmp/chat-boundaries-comment.md
            gh pr comment 40 --body-file /tmp/chat-boundaries-comment.md
            exit "$status"
          fi

      - name: Refresh Wrangler toolchain lock
        run: npm install --save-dev --save-exact wrangler@4.116.0 --no-audit --no-fund

      - name: Commit converted boundaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: separate chat DTO and domain boundaries'
          git push origin HEAD:refactor/maintainability-session-state-phase1

      - name: Validate converted boundaries
        run: |
          npm run typecheck
          npm run test
          npm run build
