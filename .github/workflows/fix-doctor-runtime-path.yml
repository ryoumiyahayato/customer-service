name: Fix doctor runtime path

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'refactor/maintainability-session-state-phase1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/maintainability-session-state-phase1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply doctor path fix
        run: |
          python3 scripts/fix-doctor-runtime-path.py
          git checkout HEAD -- scripts/fix-doctor-runtime-path.py .github/workflows/fix-doctor-runtime-path.yml

      - name: Commit doctor update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/doctor.mjs
          git commit -m 'test: inspect runtime worker in doctor checks'
          git push origin HEAD:refactor/maintainability-session-state-phase1

      - name: Validate doctor and full root gates
        run: |
          npm ci --no-audit --no-fund
          npm run doctor
          npm run typecheck
          npm run test
          npm run check:static-contracts
          npm run check:business-closures
          npm run check:obvious
          npm run build
