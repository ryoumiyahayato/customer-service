name: Fix worker boundary types

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'refactor/maintainability-session-state-phase1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/maintainability-session-state-phase1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply fixes
        run: |
          python3 scripts/fix-worker-boundary-types.py
          git checkout HEAD -- scripts/fix-worker-boundary-types.py .github/workflows/fix-worker-boundary-types.yml

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'fix: align extracted worker boundary types'
          git push origin HEAD:refactor/maintainability-session-state-phase1

      - name: Validate
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test
          npm run check:static-contracts
          npm run check:business-closures
          npm run check:obvious
          npm run build
