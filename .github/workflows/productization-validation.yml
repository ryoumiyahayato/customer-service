name: Productization validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize-pr52-preset:
    if: github.event.pull_request.number == 52 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-security-boundaries-20260809
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply preset worker integration
        run: node scripts/apply-pr52-preset-integration.mjs
      - name: Type Checks
        run: npm run typecheck
      - name: Unit Tests
        run: npm run test:unit
      - name: SQLite Integration Tests
        run: npm run test:integration
      - name: Build
        run: npm run build
      - name: Restore normal workflow and remove transformer
        run: |
          set -euo pipefail
          git fetch -q origin main
          git checkout origin/main -- .github/workflows/productization-validation.yml
          rm -f scripts/apply-pr52-preset-integration.mjs
      - name: Commit only after validation passes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: deliver preset content as real chat messages"
          git push origin HEAD:fix/p0-security-boundaries-20260809
