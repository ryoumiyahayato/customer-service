name: Apply P1 convergence

on:
  push:
    branches:
      - fix/p0-security-boundaries-20260809
    paths:
      - scripts/apply-p1-convergence.mjs
      - .github/workflows/apply-p1-convergence.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-security-boundaries-20260809
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply convergence transformation
        run: node scripts/apply-p1-convergence.mjs
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Typecheck transformed tree
        run: npm run typecheck
      - name: Unit tests on transformed tree
        run: npm run test:unit
      - name: Commit validated transformation
        run: |
          rm -f scripts/apply-p1-convergence.mjs .github/workflows/apply-p1-convergence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: converge admin state and security boundaries"
          git push origin HEAD:fix/p0-security-boundaries-20260809
