name: Apply maintainability stage 2

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  apply:
    if: github.head_ref == 'refactor/maintainability-session-state-phase1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/maintainability-session-state-phase1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply repository transformation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/apply-maintainability-stage2.mjs > /tmp/stage2.log 2>&1
          status=$?
          cat /tmp/stage2.log
          if [ "$status" -ne 0 ]; then
            {
              echo '## Stage 2 transformation failure'
              echo
              echo '```text'
              tail -n 300 /tmp/stage2.log
              echo '```'
            } > /tmp/stage2-comment.md
            gh pr comment 40 --body-file /tmp/stage2-comment.md
            exit "$status"
          fi

      - name: Refresh Wrangler toolchain lock
        run: npm install --save-dev --save-exact wrangler@4.116.0 --no-audit --no-fund

      - name: Commit transformed repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: complete maintainability boundaries and services'
          git push origin HEAD:refactor/maintainability-session-state-phase1

      - name: Validate transformed repository
        run: |
          npm run typecheck
          npm run test
          npm run check:static-contracts
          npm run check:business-closures
          npm run check:obvious
          npm run build
