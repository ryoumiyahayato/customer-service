name: Apply worker boundaries

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  apply:
    if: github.head_ref == 'refactor/maintainability-session-state-phase1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/maintainability-session-state-phase1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply worker boundary extraction
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/apply-worker-boundaries.py > /tmp/worker-boundaries.log 2>&1
          status=$?
          cat /tmp/worker-boundaries.log
          if [ "$status" -ne 0 ]; then
            {
              echo '## Worker boundary extraction failure'
              echo
              echo '```text'
              tail -n 300 /tmp/worker-boundaries.log
              echo '```'
            } > /tmp/worker-boundaries-comment.md
            gh pr comment 40 --body-file /tmp/worker-boundaries-comment.md
            exit "$status"
          fi
          git checkout HEAD -- scripts/apply-worker-boundaries.py .github/workflows/apply-worker-boundaries.yml

      - name: Commit extracted worker boundaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts
          git commit -m 'refactor: extract worker services and security primitives'
          git push origin HEAD:refactor/maintainability-session-state-phase1

      - name: Validate extracted boundaries
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test
          npm run check:static-contracts
          npm run check:business-closures
          npm run check:obvious
          npm run build
