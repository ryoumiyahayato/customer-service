name: PR52 P2 convergence

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  transform:
    if: github.event.pull_request.number == 52 && github.event.pull_request.head.ref == 'fix/p0-security-boundaries-20260809' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply asserted P2 transform
        run: node scripts/apply-pr52-p2-fixes.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Repository unit tests
        run: npm run test:unit
      - name: SQLite integration tests
        run: npm run test:integration
      - name: Remove one-shot transformer
        run: |
          rm -f scripts/apply-pr52-p2-fixes.mjs
          rm -f .github/workflows/pr52-p2-transform.yml
      - name: Commit transformed tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "refactor: complete PR52 P2 cleanup"
          git push origin HEAD:fix/p0-security-boundaries-20260809
